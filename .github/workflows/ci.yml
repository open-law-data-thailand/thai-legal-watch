name: ci
on:
  push: { branches: [main] }
  pull_request:
  # 16:00 UTC is 23:00 in Bangkok, after the dataset's own nightly has published to Hugging Face.
  schedule: [{ cron: '0 16 * * *' }]
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to build (blank = every year published in both layers)'
        required: false
jobs:
  # The deploy scripts became load-bearing — they pull, build, check Cloudflare's limits and verify
  # the edge afterwards — and a syntax error in them only shows up at 23:00 on the build box.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No third-party action: the org allows only GitHub-owned and verified ones, and a
      # `@master` reference to someone else's repository is a supply-chain risk in any case.
      # ShellCheck ships on the runner image; installing it is only a fallback.
      - name: Check the deploy scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | head -2
          for f in infra/*.sh; do bash -n "$f"; done
          shellcheck -S warning infra/*.sh

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e "pipeline[dev]"
      - run: ruff check pipeline
      - run: pytest pipeline
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e pipeline
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint && npm run format
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }

  # Push code, and this puts it live. Nothing about the site lives on anyone's laptop: the data
  # comes from Hugging Face, is built here, and is deployed here — which is also why the schedule
  # above is all it takes to keep the site current.
  deploy:
    if: github.event_name != 'pull_request'
    needs: [infra, pipeline, web]
    runs-on: ubuntu-latest
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e pipeline huggingface_hub

      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Hugging Face only re-fetches what changed, so yesterday's copy makes a daily run cheap.
      # One save per day rather than one per push keeps the 10 GB cache from churning.
      - uses: actions/cache@v4
        with:
          path: hfdata
          key: hfdata-${{ steps.day.outputs.d }}
          restore-keys: hfdata-

      - name: Fetch the dataset layers this site reads
        run: |
          infra/fetch-dataset.py --out hfdata --root hfroot --emit-years years.txt \
            ${{ inputs.years && format('--years {0}', inputs.years) || '' }}
          echo "TLW_YEARS=$(cat years.txt)" >> "$GITHUB_ENV"

      - name: Build the site's data
        run: tlw-build --root hfroot --out dist-data --years "$TLW_YEARS"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: infra/deploy.sh "$PWD/dist-data"

      - name: Prove the edge serves this build
        run: infra/verify-live.sh "$PWD/dist-data"
