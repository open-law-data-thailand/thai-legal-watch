    <!-- What LINE, Slack, Facebook and X show when somebody shares the site. Without these a
         shared link is a bare URL, which for a public legal resource is most of the first
         impression. No og:image: an SVG is not reliably rendered by these scrapers, and a
         wrong-sized PNG looks worse than none. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thai Legal Watch" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:url" content="https://thai-legal-watch.pages.dev/" />
    <meta property="og:title" content="Thai Legal Watch — ราชกิจจานุเบกษา อ่านเป็นหมวด ติดตามเป็นเรื่อง" />
    <meta
      property="og:description"
      content="ทุกฉบับที่ประกาศถูกจำแนกว่าเรื่องอะไร ทำอะไร ใครออก พร้อมเล่ม ตอน หน้า สำหรับอ้างอิง ค้นย้อนหลังตั้งแต่ พ.ศ. 2548 และติดตามหมวด จังหวัด หรือหน่วยงานผ่าน RSS"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
