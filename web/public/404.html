<!doctype html>
<!--
  Cloudflare Pages serves this, with a real 404 status, for any path that is not a file. Without
  it every mistyped path answered 200 with the app shell — a soft 404, which tells a crawler the
  page exists and tells a reader nothing.

  Deliberately self-contained: no stylesheet, no script, no font from anywhere. A page that
  appears when something is already wrong should not depend on anything else being right, and it
  has to satisfy a Content-Security-Policy of `default-src 'self'` on its own.

  The site's own routes are hash routes, so nothing here is a route: a reader who lands on this
  page wants a way back, not an explanation of the router.
-->

      :root {

        --ink-2: #55525f;
        --paper: #fbfaf7;
        --line: #e2dfd7;
        --accent: #5b45c9;
      }
      * {

      }
      body {
        margin: 0;

      }

        margin: 0 0 12px;
      }
      p {
        margin: 0 0 18px;
        color: var(--ink-2);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      a {
        display: inline-block;
        padding: 9px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        background: #fff;
      }
      a:hover {
        border-color: var(--accent);
      }
      a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      code {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1px 5px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>

      <div class="links">

        <a href="/#/ratchakitcha/explore">สำรวจทั้งคลัง</a>

</html>
