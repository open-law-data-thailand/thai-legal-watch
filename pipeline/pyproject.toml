[project]
name = "tlw-pipeline"
version = "0.1.0"
description = "Thai Legal Watch: turn the OpenLawData taxonomy layer into static site data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tlw-build = "tlw_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tlw_pipeline*"]

[tool.ruff]
line-length = 124
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115", "E501"]
"tlw_pipeline/fixtures.py" = ["SIM115", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
